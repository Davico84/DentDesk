name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Valida las specs y changes de OpenSpec en cada PR/push.
  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate OpenSpec (strict)
        run: pnpm dlx @fission-ai/openspec@latest validate --strict

  # Backend Java/Maven. Se activa cuando exista backend/ (skip mientras tanto).
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check backend module
        id: check
        run: |
          if [ -f backend/pom.xml ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "backend/ aún no existe — skip"; fi
      - uses: actions/setup-java@v4
        if: steps.check.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify (mvn)
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: ./mvnw -B verify

  # Frontend React/Vite. Se activa cuando exista frontend/ (skip mientras tanto).
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend module
        id: check
        run: |
          if [ -f frontend/package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "frontend/ aún no existe — skip"; fi
      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.exists == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Validate (typecheck + lint + test)
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm validate
