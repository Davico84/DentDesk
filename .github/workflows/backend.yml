name: Backend

on:
  # Sin filtro de rutas en los PR: el Ruleset de main exige los seis checks y uno que no se dispara
  # queda pendiente para siempre (update-ci-required-checks). En push el filtro se mantiene.
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
    paths:
      - "modules/backend/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: modules/backend

jobs:
  # Compila y corre los tests (test slices + Testcontainers). En CI Linux
  # Testcontainers funciona con el socket Docker estándar.
  #
  # Incluye el GUARDIÁN DEL CONTRATO (ContractDriftIT): compara la especificación que el backend
  # publica ahora con contracts/openapi.json y falla si difieren. Es decir: cambiar la API sin
  # regenerar el contrato ROMPE LA BUILD. Se resuelve como test (y no como un job que arranque un
  # servidor y le haga curl) porque es la vía más estable en CI.
  verify:
    name: backend-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify (compile + tests)
        run: ./mvnw -B verify

  # TODO(futuro): job 'lint' con Spotless/Checkstyle cuando se configure.
  # TODO(futuro): job 'coverage' con JaCoCo (report + upload-artifact) cuando se configure.
