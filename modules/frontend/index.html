<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- El enlace de recuperación lleva el token en la query: no se envía a otros sitios como referencia
         (update-authentication-password-recovery D7). -->
    <meta name="referrer" content="no-referrer" />
    <title>Dentdesk</title>
    <!--
      Atkinson Hyperlegible: SOLO para el odontograma (design.md D10), no la tipografía global de
      la app. Diseñada para baja visión — distingue I/l/1 y O/0, crítico en las siglas normativas
      NTS 188 que se imprimen en cada pieza. El resto de la UI sigue con la fuente del sistema.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Atkinson+Hyperlegible+Mono:wght@400;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
