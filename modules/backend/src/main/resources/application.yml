# Configuración única de OdontoRisas (sin perfiles).
# TODOS los valores configurables se externalizan como secretos:
#  - en local se cargan de ./secrets.properties (ignorado por git)
#  - en despliegue se inyectan como variables de entorno
# Solo se versiona secrets.properties.example. No poner valores sensibles aquí.
spring:
  application:
    name: odontorisas
  config:
    import: "optional:file:./secrets.properties"

  mvc:
    problemdetails:
      enabled: true          # errores en formato RFC 9457 (ProblemDetail) de forma nativa

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none        # el esquema lo gestiona Flyway
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Menor privilegio: las migraciones (DDL) corren con el rol admin/owner y la app
    # (datasource de arriba) con un rol solo-DML no-owner. Si no se definen credenciales
    # de admin, Flyway usa las mismas de la app (entorno local de un solo usuario).
    user: ${DB_ADMIN_USERNAME:${DB_USERNAME}}
    password: ${DB_ADMIN_PASSWORD:${DB_PASSWORD}}

# Detrás de un balanceador o proxy que termina TLS, la petición llega al backend por http
# aunque el cliente la hiciera por https. Sin esto Spring cree que el esquema es http y:
#   - la cookie `Secure` del refresh token no se comporta como debe,
#   - las URLs absolutas y los redirects se generan con el esquema/host equivocados,
#   - en los logs se ve la IP del proxy, no la del cliente.
# Con FRAMEWORK, Spring respeta las cabeceras X-Forwarded-* que envía el proxy.
# La app es stateless (JWT, sin sesión de servidor), así que escala horizontal sin sticky
# sessions; esto es lo único que necesitaba para vivir detrás de un balanceador.
server:
  forward-headers-strategy: framework

# Documentación de la API (update-api-docs-exposure). Un solo interruptor para el documento OpenAPI
# y la interfaz de Swagger, APAGADO por defecto: un despliegue que no lo configure no expone la API.
# En local se enciende con SWAGGER_ENABLED=true en secrets.properties. Con el interruptor apagado
# las rutas siguen en PublicPaths pero no existen, así que responden 404.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:odontorisas}
      access-ttl: ${JWT_ACCESS_TTL:PT15M}      # ISO-8601 Duration (15 min)
      refresh-ttl: ${JWT_REFRESH_TTL:P7D}      # ISO-8601 Duration (7 días)
    cookie:
      refresh-name: ${REFRESH_COOKIE_NAME:refresh_token}
      secure: ${COOKIE_SECURE:true}            # true en despliegue; false para http local si hace falta
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    lockout:
      max-attempts: ${AUTH_LOCKOUT_MAX_ATTEMPTS:5}
      window: ${AUTH_LOCKOUT_WINDOW:PT15M}     # ISO-8601 Duration (15 min)

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
